<h1>Шаг {{ step }}: Выберите урок для редактирования</h1>

<form method="post" id="lessonForm">
    <label htmlFor="lessonSelect">Выберите урок:</label>
    <select name="lesson_id" id="lessonSelect">
        <option value="">-- выберите урок --</option>
        {% for l in lessons %}
        <option value="{{ l.lesson_id }}">
            {{ l.lesson_title }} — Модуль: {{ l.module_title }} — Шагов: {{ l.steps_count }}
        </option>
        {% endfor %}
    </select>
    <br><br>

    <div id="promptContainer" style="border:1px solid #ccc; padding:10px; margin-top:10px; display:none;">
        <strong>Промпт для генерации квестов:</strong>
        <pre id="promptText" style="white-space: pre-wrap;"></pre>
        <button type="button" id="copyPromptBtn">Скопировать промпт</button>
    </div>

    <br>
    <label htmlFor="lessonText">JSON с заданиями для Stepik:</label><br>
    <textarea id="lessonText" name="json_input" rows="20" style="width:100%; font-family: monospace;"
          placeholder="Вставьте сюда JSON с заданиями"></textarea>

    <br><br>
    <button type="submit" id="saveBtn">Сохранить</button>
</form>
<script>
const select = document.getElementById("lessonSelect");
const promptContainer = document.getElementById("promptContainer");
const promptText = document.getElementById("promptText");
const copyBtn = document.getElementById("copyPromptBtn");
const saveBtn = document.getElementById("saveBtn");
const lessonText = document.getElementById("lessonText");

// Функция для обновления списка уроков
function reloadLessonList() {
    fetch('/get_lessons')  // эндпоинт, который возвращает актуальный список уроков
        .then(resp => resp.json())
        .then(data => {
            if (data.lessons) {
                // Очищаем старые options
                select.innerHTML = '<option value="">-- выберите урок --</option>';
                data.lessons.forEach(l => {
                    const opt = document.createElement('option');
                    opt.value = l.lesson_id;
                    opt.textContent = `${l.lesson_title} — Модуль: ${l.module_title} — Шагов: ${l.steps_count}`;
                    select.appendChild(opt);
                });
            }
        })
        .catch(err => console.error("Ошибка при перезагрузке списка уроков:", err));
}

// Показ промпта при выборе урока
select.addEventListener("change", function () {
    const lessonId = select.value;
    if (!lessonId) {
        promptText.textContent = "";
        promptContainer.style.display = "none";
        return;
    }

    fetch(`/get_prompt?lesson_id=${lessonId}`)
        .then(response => response.json())
        .then(data => {
            if (data.prompt) {
                promptText.textContent = data.prompt;
                promptContainer.style.display = "block";
            } else {
                promptText.textContent = "";
                promptContainer.style.display = "none";
            }
        })
        .catch(err => {
            console.error("Ошибка при получении промпта:", err);
            promptText.textContent = "";
            promptContainer.style.display = "none";
        });
});

// Копирование промпта
// Копирование промпта
copyBtn.addEventListener("click", function () {
    if (promptText.textContent) {
        navigator.clipboard.writeText(promptText.textContent)
            .then(() => {
                // Меняем вид кнопки
                copyBtn.textContent = "✅ Скопировано!";
                copyBtn.style.backgroundColor = "#4caf50"; // зелёный фон
                copyBtn.style.color = "#fff";

                // Через 5 секунд возвращаем обратно
                setTimeout(() => {
                    copyBtn.textContent = "Скопировать промпт";
                    copyBtn.style.backgroundColor = "";
                    copyBtn.style.color = "";
                }, 5000);
            })
            .catch(err => {
                copyBtn.textContent = "⚠ Ошибка копирования!";
                copyBtn.style.backgroundColor = "red";
                copyBtn.style.color = "#fff";

                setTimeout(() => {
                    copyBtn.textContent = "Скопировать промпт";
                    copyBtn.style.backgroundColor = "";
                    copyBtn.style.color = "";
                }, 5000);
            });
    }
});

// Сохранение текста через AJAX
saveBtn.addEventListener("click", function (event) {
    event.preventDefault();

    const lessonId = select.value;
    const textData = lessonText.value.trim();

    if (!lessonId || !textData) {
        alert("Выберите урок и вставьте текст!");
        return;
    }

    // Блокируем кнопку на время отправки
    saveBtn.disabled = true;
    saveBtn.textContent = "Сохраняем...";

    fetch(`/save_lesson_text?lesson_id=${lessonId}`, {
        method: "POST",
        body: textData
    })
    .then(resp => resp.json())
    .then(data => {
        if (data.success) {
            alert("Текст успешно сохранен и шаги загружены!");
            lessonText.value = ""; // очищаем поле после успешной отправки
            reloadLessonList();  // обновляем список уроков
        } else {
            alert("Ошибка: " + (data.error || "Неизвестная ошибка"));
        }
    })
    .catch(err => alert("Ошибка при сохранении: " + err))
    .finally(() => {
        saveBtn.disabled = false;
        saveBtn.textContent = "Сохранить";
    });
});

</script>
